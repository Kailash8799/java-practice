spring:
  application:
    name: SpringDataJpa
  datasource:
    url: jdbc:mysql://localhost:3307/springdatajpa?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database: MYSQL
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      dialect: org.hibernate.dialect.MySQLDialect
      format_sql: true
